<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nota HP Baru | Sandy Cell</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto py-8 px-4">

<!-- HEADER -->
<div class="bg-white rounded-2xl shadow p-6 mb-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i data-lucide="smartphone" class="w-6 h-6 text-teal-600"></i>
        Nota Penjualan HP Baru
      </h1>
      <p class="text-sm text-gray-500">Transaksi Resmi Sandy Cell</p>
    </div>
    <div class="bg-teal-50 px-4 py-2 rounded-xl text-sm font-semibold text-teal-700">
      <div id="notaNumber"></div>
      <div id="notaDate" class="text-xs text-teal-600"></div>
    </div>
  </div>
</div>

<!-- DATA PEMBELI -->
<div class="bg-white rounded-2xl shadow p-6 mb-6 space-y-4">
<h2 class="font-semibold">Data Pembeli</h2>
<div class="grid sm:grid-cols-2 gap-4">
<input id="namaPembeli" type="text" placeholder="Nama Pembeli" class="border rounded-lg px-3 py-2 text-sm">
<input id="hpPembeli" type="text" placeholder="Nomor HP Pembeli" class="border rounded-lg px-3 py-2 text-sm">
</div>
</div>

<!-- DETAIL HP -->
<div class="bg-white rounded-2xl shadow p-6 mb-6 space-y-4">
<h2 class="font-semibold">Detail HP</h2>
<div class="grid sm:grid-cols-2 gap-4">
<input id="merk" type="text" placeholder="Merk" class="border rounded-lg px-3 py-2 text-sm">
<input id="tipe" type="text" placeholder="Tipe" class="border rounded-lg px-3 py-2 text-sm">
<input id="warna" type="text" placeholder="Warna" class="border rounded-lg px-3 py-2 text-sm">
<input id="storage" type="text" placeholder="Storage" class="border rounded-lg px-3 py-2 text-sm">
<input id="imei1" type="text" placeholder="IMEI 1" class="border rounded-lg px-3 py-2 text-sm">
<input id="imei2" type="text" placeholder="IMEI 2" class="border rounded-lg px-3 py-2 text-sm">
</div>
</div>

<!-- PEMBAYARAN -->
<div class="bg-white rounded-2xl shadow p-6 mb-6 space-y-4">
<h2 class="font-semibold">Pembayaran</h2>
<div class="grid sm:grid-cols-2 gap-4">
<input id="harga" type="text" inputmode="numeric" placeholder="Harga HP" class="border rounded-lg px-3 py-2 text-sm">
<input id="diskon" type="text" inputmode="numeric" placeholder="Diskon" class="border rounded-lg px-3 py-2 text-sm">
<select id="metode" class="border rounded-lg px-3 py-2 text-sm">
<option>Cash</option>
<option>Transfer</option>
<option>QRIS</option>
</select>
<select id="garansi" class="border rounded-lg px-3 py-2 text-sm">
<option>Garansi Resmi 1 Tahun</option>
<option>Garansi Toko 1 Bulan</option>
<option>Tidak Ada Garansi</option>
</select>
</div>

<div class="bg-gray-50 rounded-lg p-4 text-sm space-y-2">
<div class="flex justify-between">
<span>Total Setelah Diskon</span>
<span id="totalHarga">Rp 0</span>
</div>
<div class="flex justify-between">
<span>Sisa Pembayaran</span>
<span id="sisaBayar">Rp 0</span>
</div>
</div>
</div>

<!-- PRINT -->
<div class="bg-white rounded-2xl shadow p-6">
<button onclick="kirimData()" class="w-full py-3 bg-black text-white rounded-lg">
Print Nota
</button>
</div>

</div>

<script>
lucide.createIcons();

const notaNumber = document.getElementById("notaNumber");
const notaDate = document.getElementById("notaDate");

const today = new Date();
const dateStr = today.toISOString().slice(0,10).replace(/-/g,"");
const random = Math.floor(Math.random() * 900 + 100);

notaNumber.innerText = "HP-" + dateStr + "-" + random;
notaDate.innerText = today.toLocaleDateString("id-ID");

function formatRibuan(input){
  let angka = input.value.replace(/\D/g,"");
  input.value = angka.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  calculate();
}

function getAngka(value){
  return parseInt(value.replace(/\./g,"")) || 0;
}

function rupiah(n){
  return "Rp " + n.toLocaleString("id-ID");
}

const hargaInput = document.getElementById("harga");
const diskonInput = document.getElementById("diskon");

hargaInput.addEventListener("input", function(){
  formatRibuan(this);
});

diskonInput.addEventListener("input", function(){
  formatRibuan(this);
});

function calculate(){

  const harga = getAngka(hargaInput.value);
  const diskon = getAngka(diskonInput.value);

  const total = harga - diskon;

  document.getElementById("totalHarga").innerText = rupiah(total);
  document.getElementById("sisaBayar").innerText = rupiah(total);
}

function kirimData(){

  const data = {
    nota: notaNumber.innerText,
    tanggal: notaDate.innerText,
    nama: namaPembeli.value,
    hp: hpPembeli.value,
    merk: merk.value,
    tipe: tipe.value,
    warna: warna.value,
    storage: storage.value,
    imei1: imei1.value,
    imei2: imei2.value,
    harga: getAngka(hargaInput.value),
    diskon: getAngka(diskonInput.value),
    total: totalHarga.innerText,
    sisa: sisaBayar.innerText,
    metode: metode.value,
    garansi: garansi.value
  };

  localStorage.removeItem("dataNotaHP"); // bersihkan dulu
  localStorage.setItem("dataNotaHP", JSON.stringify(data));

  // kasih sedikit delay supaya benar-benar tersimpan
  setTimeout(() => {
    window.open("print-nota-hp.html", "_blank");
  }, 100);

}
</script>


</body>
</html>
